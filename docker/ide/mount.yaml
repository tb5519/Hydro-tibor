mount:
  - type: bind
    source: /bin
    target: /bin
    readonly: true
  - type: bind
    source: /lib
    target: /lib
    readonly: true
  - type: bind
    source: /lib64
    target: /lib64
    readonly: true
  - type: bind
    source: /usr
    target: /usr
    readonly: true
  - type: bind
    source: /etc
    target: /etc
    readonly: true
  - type: bind
    source: /dev/null
    target: /dev/null
  - type: bind
    source: /dev/urandom
    target: /dev/urandom
  - type: bind
    source: /dev/zero
    target: /dev/zero
  - type: tmpfs
    target: /w
    data: size=192m,nr_inodes=8k
  - type: tmpfs
    target: /tmp
    data: size=32m,nr_inodes=4k
proc: true
workDir: /w
hostName: ide-executor
domainName: ide-executor
uid: 1536
gid: 1536
