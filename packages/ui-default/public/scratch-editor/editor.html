<!doctype html><html lang="zh-cn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>OneByOne Scratch 编辑器</title><style>.onebyone-library-notice{display:flex;align-items:center;justify-content:center;gap:16px;flex:none;min-height:52px;padding:10px 20px;background:#edf4ff;color:#25456e;font:600 14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;text-align:center}
.onebyone-library-notice button{border:1px solid #2563eb;border-radius:8px;padding:7px 14px;background:#2563eb;color:white;cursor:pointer;font:inherit}
.onebyone-preset-library{display:flex;flex:none;align-items:center;gap:12px;padding:10px 20px;background:#edf4ff;color:#496987;font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif}
.onebyone-preset-library button{min-height:42px;padding:8px 20px;border:1px solid #2563eb;border-radius:10px;background:#2563eb;color:white;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;line-height:1.5}
.onebyone-preset-library button:disabled{opacity:.55;cursor:wait}
html,body,#app{height:100%;width:100%;margin:0;overflow:hidden}
/* Keep Scratch's native file/edit/title controls; account and cloud belong to OneByOne. */
[class*="menu-bar_menu-bar_"]{height:48px!important;padding-right:360px;background:#4c97ff!important;background-image:none!important}
[class*="menu-bar_menu-bar-item_"]{height:48px!important}
[class*="menu-bar_menu-bar-menu_"]{margin-top:48px!important}
[class*="menu-bar_main-menu_"]{min-width:0;gap:8px!important}
[class*="menu-bar_file-group_"]{gap:0!important}
[class*="menu-bar_growable_"]{min-width:40px;max-width:360px!important}
[class*="menu-bar_account-info-group_"],[class*="menu-bar_community-button-wrapper_"],[class*="menu-bar_feedback-link_"]{display:none!important}
[class*="menu-bar_collapsible-label_"]{display:inline!important}
[class*="menu-bar_menu-bar_"] a[href^="http"]{display:none!important}
[data-onebyone-mode="thumbnail"] [class*="stage-header_stage-menu-wrapper_"]{visibility:hidden}
.onebyone-import-confirm{max-width:430px;width:calc(100% - 48px);box-sizing:border-box;padding:24px;border:1px solid #cbdcf5;border-radius:18px;color:#243752;background:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 15px 60px #17345633}
.onebyone-import-confirm::backdrop{background:#142d4b66}
.onebyone-import-confirm h2{font-size:20px;margin:0 0 16px}
.onebyone-import-confirm p{font-size:15px;line-height:1.65;margin:0 0 12px}
.onebyone-import-confirm>div{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.onebyone-import-confirm button{min-height:44px;padding:9px 16px;border:1px solid #cbdcf5;border-radius:11px;background:#edf4ff;color:#2868c5;font-size:15px;font-weight:600;cursor:pointer}
.onebyone-import-confirm button[data-confirm]{background:#2563eb;color:white;border-color:#2563eb}
.onebyone-import-confirm button:focus-visible{outline:3px solid #8cb8fa;outline-offset:3px}
@media(max-width:600px){[class*="menu-bar_menu-bar_"]{width:100vw!important;max-width:100vw;padding-right:220px}[class*="menu-bar_menu-bar-item_"]{padding-left:5px!important;padding-right:5px!important}[class*="menu-bar_file-group_"] img{display:none}[class*="menu-bar_main-menu_"]{gap:3px!important}[class*="menu-bar_divider_"]{display:none}}</style></head><body><div id="app"></div><script src="https://static.onebyone.run/static/20260921-scratch-presets-v3/scratch-editor/js/pentapod/editor.58ce670a8472d8d9d607.js" crossorigin="anonymous"></script></body></html>
