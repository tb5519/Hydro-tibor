<footer class="footer footer--honors">
  <div class="row"><div class="columns">
    {% if show_topics|default(true) and handler.user.hasPerm(perm.PERM_VIEW_RANKING) %}
    <section class="honor-wall" data-honor-wall data-honor-wall-url="{{ url('badge_honor_wall') }}" aria-labelledby="honor-wall-title" aria-busy="true">
      <div class="honor-wall__heading">
        <div>
          <div class="honor-wall__title-row">
            <h2 id="honor-wall-title">荣誉墙</h2>
            <p class="honor-wall__eyebrow"><span aria-hidden="true">✦</span> HALL OF HONOR</p>
          </div>
          <p class="honor-wall__subtitle">每一枚徽章，都记录着闪闪发光的努力。</p>
        </div>
        <div class="honor-wall__heading-actions">
          <span class="honor-wall__count" data-honor-wall-count hidden></span>
          <button class="honor-wall__motion-toggle" data-honor-wall-motion type="button" aria-pressed="false" hidden>暂停动画</button>
        </div>
      </div>
      <div class="honor-wall__viewport" data-honor-wall-viewport>
        <div class="honor-wall__grid" data-honor-wall-grid></div>
      </div>
      <p class="honor-wall__status" data-honor-wall-status role="status">正在点亮荣誉星光…</p>
      <button class="honor-wall__retry" data-honor-wall-retry type="button" hidden>重新加载</button>
      <noscript><p class="honor-wall__status">启用 JavaScript 后即可查看徽章与获得它们的学员。</p></noscript>
    </section>
    {% endif %}
    <div class="footer__extra-link">
      <div class="footer__extra-left">
        <ol>
          <li class="footer__extra-link-item nojs--hide" data-dropdown-target="#menu-footer-lang">
            <span><span class="icon icon-global"></span> Language <span class="icon icon-expand_less"></span></span>
            <ol class="dropdown-target menu" id="menu-footer-lang">
            {%- for k, v in model.setting.SETTINGS_BY_KEY['viewLang'].range -%}
              <li class="menu__item"><a class="menu__link" href="{{ url('switch_language', lang=k) }}">{{ v }}</a></li>
            {%- endfor -%}
            </ol>
          </li>
        </ol>
      </div>
    </div>
  </div></div>
</footer>
