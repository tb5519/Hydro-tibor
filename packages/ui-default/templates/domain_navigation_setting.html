{% extends "domain_base.html" %}
{% block domain_content %}
<style>
  .domain-navigation-setting { display: grid; gap: 16px; }
  .domain-navigation-setting__hero, .domain-navigation-setting__card { border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 10px 28px rgba(15, 23, 42, .06); }
  .domain-navigation-setting__hero { padding: 20px; background: linear-gradient(135deg, #eff6ff, #fff 58%, #f5f3ff); }
  .domain-navigation-setting h1, .domain-navigation-setting h2 { margin: 0; color: #0f172a; }
  .domain-navigation-setting h1 { font-size: 1.5rem; }
  .domain-navigation-setting h2 { font-size: 1.08rem; }
  .domain-navigation-setting p { margin: 8px 0 0; color: #64748b; font-size: .88rem; line-height: 1.65; }
  .domain-navigation-setting__card { padding: 18px; }
  .domain-navigation-setting__saved { margin-bottom: 14px; border: 1px solid #bbf7d0; border-radius: 10px; padding: 10px 12px; color: #166534; background: #f0fdf4; }
  .domain-navigation-setting__items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .domain-navigation-setting__item { display: flex; align-items: center; gap: 12px; border: 1px solid #dbe7f3; border-radius: 13px; padding: 13px 14px; background: #f8fafc; cursor: pointer; transition: .16s ease; transition-property: border-color, background, box-shadow; }
  .domain-navigation-setting__item:hover { border-color: #93c5fd; background: #f4f9ff; }
  .domain-navigation-setting__item:has(input:checked) { border-color: #60a5fa; background: #eff6ff; box-shadow: inset 0 0 0 1px #bfdbfe; }
  .domain-navigation-setting__check { display: grid; flex: 0 0 auto; width: 24px; height: 24px; place-items: center; border: 1px solid #bfdbfe; border-radius: 8px; background: #fff; color: #2563eb; }
  .domain-navigation-setting__check input { width: 16px; height: 16px; margin: 0; accent-color: #2563eb; }
  .domain-navigation-setting__item strong { color: #0f172a; font-size: .98rem; }
  .domain-navigation-setting__note { margin-top: 15px; border: 1px solid #dbeafe; border-radius: 11px; padding: 10px 12px; color: #475569; background: #f0f7ff; font-size: .82rem; line-height: 1.55; }
  .domain-navigation-setting__actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  @media (max-width: 42em) { .domain-navigation-setting__items { grid-template-columns: 1fr; } }
</style>

<div class="domain-navigation-setting">
  <section class="domain-navigation-setting__hero">
    <h1>{{ _('导航显示') }}</h1>
    <p>{{ _('为当前域选择要展示在顶部导航中的学习入口。未设置过的域默认全部显示。') }}</p>
  </section>
  <form method="post" class="domain-navigation-setting__card">
    {% if saved %}<div class="domain-navigation-setting__saved">{{ _('导航显示设置已保存。') }}</div>{% endif %}
    <h2>{{ _('学习入口') }}</h2>
    <div class="domain-navigation-setting__items">
      {% for item in items %}
        <label class="domain-navigation-setting__item">
          <span class="domain-navigation-setting__check"><input type="checkbox" name="show_{{ item.id }}"{% if item.visible %} checked{% endif %}></span>
          <span><strong>{{ _(item.id) }}</strong><p>{{ _('在当前域的顶部导航中显示') }}</p></span>
        </label>
      {% endfor %}
    </div>
    <div class="domain-navigation-setting__note">{{ _('关闭只会隐藏导航入口，不会删除已有数据；拥有链接的用户仍可按原有权限访问对应页面。') }}</div>
    <div class="domain-navigation-setting__actions"><button type="submit" class="rounded primary button">{{ _('保存设置') }}</button></div>
  </form>
</div>
{% endblock %}
