{% extends "layout/basic.html" %}
{% block content %}
<div class="problem-create-shell problem-objective-shell">
  <a class="problem-create-back" href="{{ url('problem_create') }}"><span aria-hidden="true">←</span> 返回类型选择</a>
  <header class="problem-create-heading problem-create-heading--compact">
    <span class="problem-create-eyebrow">题库 · 客观题</span>
    <h1>{% if page_name == 'problem_edit_objective' %}编辑客观题{% else %}创建一道客观题{% endif %}</h1>
    <p>写好题干，选定答案，再为它贴上知识点标签。</p>
  </header>
  <div data-objective-editor data-initial="{{ {
    objective: objective|default({}),
    title: pdoc.title|default(''),
    pid: pdoc.pid|default(''),
    tags: pdoc.tag|default([]),
    hidden: pdoc.hidden|default(false),
    difficulty: pdoc.difficulty|default(''),
    editing: page_name == 'problem_edit_objective',
    cancelUrl: url('problem_detail', pid=pdoc.docId) if pdoc else url('problem_create')
  }|json }}">
    <div class="objective-card objective-loading" role="status">正在准备题目编辑器…</div>
  </div>
  <noscript><p class="objective-form-error">请启用 JavaScript，以使用客观题选项编辑和即时预览。</p></noscript>
</div>
{% endblock %}
